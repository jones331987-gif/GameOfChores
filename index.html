<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Chore Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1FB;
    --card-bg: #FFFFFF;
    --card-border: #EAE0F5;
    --card-border-soft: #F0E7FA;
    --text: #4A3B58;
    --text-muted: #8B7C9C;
    --text-faint: #B4A7C7;
    --sage: #5FA588;
    --sage-soft: #E4F3EC;
    --sun: #F4B740;
    --sun-soft: #FBEED0;
    --berry: #EE6E9C;
    --berry-soft: #FBE3EC;
    --danger: #E8615A;
    --input-bg: #FBF8FE;
  }
  :root[data-theme="dark"] {
    --bg: #1E1A28;
    --card-bg: #292335;
    --card-border: #3D3450;
    --card-border-soft: #362E47;
    --text: #F0EAF8;
    --text-muted: #B7A9CC;
    --text-faint: #8B7CA3;
    --sage: #7FCBA6;
    --sage-soft: #24382F;
    --sun: #FFC857;
    --sun-soft: #3A2F1A;
    --berry: #FF93B8;
    --berry-soft: #3D2434;
    --danger: #FF8A82;
    --input-bg: #221D2C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { width: 100%; max-width: 1120px; }
  .display { font-family: 'Baloo 2', cursive; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border-soft);
    border-radius: 16px;
    transition: border-color 0.15s ease, background 0.2s ease;
  }
  .card:hover { border-color: #5fa58877; }
  button { font-family: inherit; cursor: pointer; border: none; }
  button:disabled { cursor: not-allowed; }
  .btn { transition: transform 0.12s ease, filter 0.12s ease; }
  .btn:active { transform: scale(0.94); }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  input {
    font-family: inherit;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    transition: background 0.2s ease;
  }
  input:focus { outline: none; border-color: var(--sage); }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  select {
    font-family: inherit;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
  }
  select:focus { outline: none; border-color: var(--sage); }
  .row { display: flex; align-items: center; }
  /* Cards flow into as many columns as fit; sections sit side by side on wide screens. */
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cols3, .cols2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 20px; align-items: start; }
  @media (min-width: 860px) {
    .cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .sect { margin-bottom: 22px; min-width: 0; }
  .sect-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; }
  .pill { border-radius: 999px; font-weight: 700; font-size: 12px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
  .icon-trash, .icon-edit { background: none; padding: 2px 4px; }
  .icon-edit { color: var(--text-faint); font-size: 13px; }
  .icon-trash { opacity: 0; transition: opacity 0.15s ease; }
  .card:hover .icon-trash { opacity: 1; }
  @media (hover: none) { .icon-trash { opacity: 1; } }
  .coin::before { content: "🪙"; font-size: 11px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .sync-badge { font-size: 11px; font-weight: 700; }
  .theme-btn {
    width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: var(--card-border-soft); font-size: 14px; flex-shrink: 0;
  }
  a.link { color: var(--sage); font-weight: 700; text-decoration: none; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- theme (light/dark — a per-device preference, not synced) ----------
const THEME_KEY = "choreGardenTheme";
function getTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") return saved;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
}
function toggleTheme() {
  const next = getTheme() === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
  render();
}
applyTheme(getTheme()); // set immediately, before first render, to avoid a flash of the wrong theme

/* =========================================================================
   Sync is already configured for this household's shared garden — it
   points at your Firebase Realtime Database, so both of you syncing
   through the same URL below. No further setup needed.
   ========================================================================= */
const FIREBASE_URL = "https://gameofchores-default-rtdb.europe-west1.firebasedatabase.app";
const DB_PATH = "choreGarden";
const SYNC_ENABLED = FIREBASE_URL && FIREBASE_URL !== "PASTE_YOUR_FIREBASE_URL_HERE";
const POLL_INTERVAL_MS = 20000;



const STORAGE_KEY = "choreGardenState";

const DEFAULT_PLAYERS = [
  { id: "p1", name: "You", color: "#EE6E9C", initial: "Y", points: 0 },
  { id: "p2", name: "Partner", color: "#5FA588", initial: "P", points: 0 },
];

const DEFAULT_CHORES = [
  { id: "c1", name: "Dishes", points: 5, frequency: "daily", assignedTo: "p1", lastDoneBy: null, lastDoneAt: null },
  { id: "c3", name: "Take out trash", points: 3, frequency: "daily", assignedTo: "p1", lastDoneBy: null, lastDoneAt: null },
  { id: "c7", name: "Cook dinner", points: 6, frequency: "daily", assignedTo: "p1", lastDoneBy: null, lastDoneAt: null },
  { id: "c2", name: "Laundry", points: 8, frequency: "weekly", assignedTo: "p2", lastDoneBy: null, lastDoneAt: null },
  { id: "c4", name: "Vacuum / mop", points: 7, frequency: "weekly", assignedTo: "p2", lastDoneBy: null, lastDoneAt: null },
  { id: "c6", name: "Grocery run", points: 6, frequency: "weekly", assignedTo: "p2", lastDoneBy: null, lastDoneAt: null },
  { id: "c5", name: "Clean bathroom", points: 10, frequency: "monthly", assignedTo: "p1", lastDoneBy: null, lastDoneAt: null },
];

const DEFAULT_REWARDS = [
  { id: "r1", name: "Pick the movie night", cost: 15 },
  { id: "r2", name: "Breakfast in bed", cost: 20 },
  { id: "r3", name: "A lazy Sunday, no chores", cost: 25 },
  { id: "r4", name: "Takeout night", cost: 30 },
];

const DEFAULT_ONE_OFF_TASKS = [];

const FREQUENCIES = [
  { id: "daily", label: "Daily", emoji: "☀️", doneLabel: "today" },
  { id: "weekly", label: "Weekly", emoji: "📅", doneLabel: "this week" },
  { id: "monthly", label: "Monthly", emoji: "🗓️", doneLabel: "this month" },
];
// Where a task can live: one of the three repeating sections, or the one-off list.
const TASK_KINDS = [...FREQUENCIES, { id: "oneoff", label: "One-off", emoji: "🎯" }];
// Chores saved before frequencies existed: the original starter chores get a
// sensible slot, anything else lands in Weekly (and can be edited from there).
const LEGACY_CHORE_FREQUENCY = { c1: "daily", c3: "daily", c7: "daily", c2: "weekly", c4: "weekly", c6: "weekly", c5: "monthly" };

function defaultState() {
  return {
    players: DEFAULT_PLAYERS,
    chores: DEFAULT_CHORES,
    rewards: DEFAULT_REWARDS,
    oneOffTasks: DEFAULT_ONE_OFF_TASKS,
    lifetimePoints: 0,
    history: [],
    updatedAt: null,
  };
}

function num(v, fallback = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

// Defensive normalizer: fills in any missing/NaN fields, e.g. from older
// saved versions of this app, or a partially-formed remote payload.
function normalize(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== "object") return base;

  const players = Array.isArray(raw.players) && raw.players.length
    ? raw.players.map((p, i) => ({
        id: p.id || base.players[i]?.id || `p${i + 1}`,
        name: p.name || base.players[i]?.name || `Player ${i + 1}`,
        color: p.color || base.players[i]?.color || "#5FA588",
        initial: (p.initial || p.name || "?").charAt(0).toUpperCase(),
        points: num(p.points, 0),
      }))
    : base.players;

  const chores = Array.isArray(raw.chores)
    ? raw.chores.map((c) => ({
        id: c.id || uid("c"),
        name: c.name || "Chore",
        points: num(c.points, 1),
        frequency: FREQUENCIES.some((f) => f.id === c.frequency) ? c.frequency : (LEGACY_CHORE_FREQUENCY[c.id] || "weekly"),
        assignedTo: c.assignedTo || players[0].id,
        lastDoneBy: c.lastDoneBy || null,
        lastDoneAt: c.lastDoneAt || null,
      }))
    : base.chores;

  const rewards = Array.isArray(raw.rewards)
    ? raw.rewards.map((r) => ({
        id: r.id || uid("r"),
        name: r.name || "Reward",
        cost: num(r.cost, 1),
      }))
    : base.rewards;

  const oneOffTasks = Array.isArray(raw.oneOffTasks)
    ? raw.oneOffTasks.map((t) => ({
        id: t.id || uid("o"),
        name: t.name || "Task",
        points: num(t.points, 1),
      }))
    : base.oneOffTasks;

  const history = Array.isArray(raw.history)
    ? raw.history.map((h) => ({
        id: h.id || uid("h"),
        at: h.at || new Date().toISOString(),
        text: h.text || "",
        delta: num(h.delta, 0),
        color: h.color || "#5FA588",
      }))
    : [];

  // lifetimePoints may be missing on older saves; fall back to the sum of
  // player points, or the old shared "points" field if that's all we have.
  const lifetimePoints = num(
    raw.lifetimePoints,
    num(raw.points, players.reduce((sum, p) => sum + p.points, 0))
  );

  return { players, chores, rewards, oneOffTasks, history, lifetimePoints, updatedAt: raw.updatedAt || null };
}

function formatRelative(iso) {
  if (!iso) return "Never done yet";
  const then = new Date(iso);
  const now = new Date();
  const diffMs = new Date(now).setHours(0, 0, 0, 0) - new Date(then).setHours(0, 0, 0, 0);
  const days = Math.round(diffMs / 86400000);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return `${days} days ago`;
  const weeks = Math.round(days / 7);
  if (weeks < 5) return `${weeks} week${weeks > 1 ? "s" : ""} ago`;
  return then.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

// A chore counts as "done" for the current day / week (Mon-Sun) / month.
function periodStart(frequency) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  if (frequency === "weekly") d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  else if (frequency === "monthly") d.setDate(1);
  return d;
}
function isDoneThisPeriod(chore) {
  if (!chore || !chore.lastDoneAt) return false;
  const t = new Date(chore.lastDoneAt);
  return !isNaN(t) && t >= periodStart(chore.frequency);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- local state ----------
let state = load();
let ui = { editing: null, focusId: null, addingChore: false, addingReward: false, addingOneOff: false, editingPlayer: null };
let syncStatus = SYNC_ENABLED ? "syncing" : "offline"; // offline | syncing | synced | error
let lastSyncedAt = null;
let pollTimer = null;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return normalize(raw ? JSON.parse(raw) : null);
  } catch (e) {
    return normalize(null);
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Could not save chore garden state", e);
  }
}

function update(mutator) {
  mutator(state);
  state.updatedAt = new Date().toISOString();
  save();
  render();
  pushRemote();
}

function playerById(id) {
  return state.players.find((p) => p.id === id) || null;
}

// ---------- actions ----------
function logChore(choreId, playerId) {
  update((s) => {
    const chore = s.chores.find((c) => c.id === choreId);
    const player = s.players.find((p) => p.id === playerId);
    if (!chore || !player) return;
    const now = new Date().toISOString();
    player.points = num(player.points, 0) + chore.points;
    s.lifetimePoints = num(s.lifetimePoints, 0) + chore.points;
    chore.lastDoneBy = playerId;
    chore.lastDoneAt = now;
    s.history.unshift({ id: uid("h"), at: now, text: `${player.name} finished "${chore.name}"`, delta: chore.points, color: player.color });
    s.history = s.history.slice(0, 12);
  });
}

function swapAssignment(choreId) {
  update((s) => {
    const chore = s.chores.find((c) => c.id === choreId);
    if (!chore) return;
    const other = s.players.find((p) => p.id !== chore.assignedTo);
    chore.assignedTo = other ? other.id : s.players[0].id;
  });
}

function redeemReward(rewardId, playerId) {
  update((s) => {
    const reward = s.rewards.find((r) => r.id === rewardId);
    const player = s.players.find((p) => p.id === playerId);
    if (!reward || !player || player.points < reward.cost) return;
    const now = new Date().toISOString();
    player.points -= reward.cost;
    s.history.unshift({ id: uid("h"), at: now, text: `${player.name} redeemed "${reward.name}"`, delta: -reward.cost, color: player.color });
    s.history = s.history.slice(0, 12);
  });
}

// `frequency` is also the id of the section whose add-form is open (ui.addingChore).
function addChore(name, points, frequency) {
  name = (name || "").trim();
  points = Math.max(1, parseInt(points, 10) || 1);
  if (!FREQUENCIES.some((f) => f.id === frequency)) frequency = "weekly";
  if (!name) return;
  ui.addingChore = false;
  update((s) => {
    s.chores.push({ id: uid("c"), name, points, frequency, assignedTo: s.players[0].id, lastDoneBy: null, lastDoneAt: null });
  });
}

function addReward(name, cost) {
  name = (name || "").trim();
  cost = Math.max(1, parseInt(cost, 10) || 1);
  if (!name) return;
  update((s) => {
    s.rewards.push({ id: uid("r"), name, cost });
  });
  ui.addingReward = false;
}

function addOneOffTask(name, points) {
  name = (name || "").trim();
  points = Math.max(1, parseInt(points, 10) || 1);
  if (!name) return;
  update((s) => {
    s.oneOffTasks.push({ id: uid("o"), name, points });
  });
  ui.addingOneOff = false;
}

// One-off tasks disappear once completed — there's no "last done" to track
// since, by definition, they're not expected to come back around.
function completeOneOffTask(taskId, playerId) {
  update((s) => {
    const task = s.oneOffTasks.find((t) => t.id === taskId);
    const player = s.players.find((p) => p.id === playerId);
    if (!task || !player) return;
    const now = new Date().toISOString();
    player.points = num(player.points, 0) + task.points;
    s.lifetimePoints = num(s.lifetimePoints, 0) + task.points;
    s.oneOffTasks = s.oneOffTasks.filter((t) => t.id !== taskId);
    s.history.unshift({ id: uid("h"), at: now, text: `${player.name} completed "${task.name}"`, delta: task.points, color: player.color });
    s.history = s.history.slice(0, 12);
  });
}

function deleteChore(id) {
  update((s) => { s.chores = s.chores.filter((c) => c.id !== id); });
}
function deleteReward(id) {
  update((s) => { s.rewards = s.rewards.filter((r) => r.id !== id); });
}
function deleteOneOffTask(id) {
  update((s) => { s.oneOffTasks = s.oneOffTasks.filter((t) => t.id !== id); });
}

// ---------- editing chores / one-off tasks / rewards in place ----------
function startEdit(type, id) {
  ui.editing = { type, id };
  ui.focusId = "editName_" + id;
  render();
}
function cancelEdit() {
  ui.editing = null;
  render();
}
function saveEdit(type, id) {
  const nameEl = document.getElementById("editName_" + id);
  const valEl = document.getElementById("editVal_" + id);
  const freqEl = document.getElementById("editFreq_" + id);
  if (!nameEl || !valEl) return;
  const name = nameEl.value.trim();
  const value = Math.max(1, parseInt(valEl.value, 10) || 1);
  if (!name) { nameEl.focus(); return; }
  const target = freqEl ? freqEl.value : null; // daily | weekly | monthly | oneoff
  ui.editing = null;
  update((s) => {
    if (type === "chore") {
      const c = s.chores.find((x) => x.id === id);
      if (!c) return;
      c.name = name;
      c.points = value;
      if (target === "oneoff") {
        // Chore -> one-off: leaves the repeating lists (last-done / turn info doesn't apply to one-offs).
        s.chores = s.chores.filter((x) => x.id !== id);
        s.oneOffTasks.push({ id: c.id, name, points: value });
      } else if (FREQUENCIES.some((f) => f.id === target)) {
        c.frequency = target;
      }
    } else if (type === "oneoff") {
      const t = s.oneOffTasks.find((x) => x.id === id);
      if (!t) return;
      t.name = name;
      t.points = value;
      if (FREQUENCIES.some((f) => f.id === target)) {
        // One-off -> repeating chore: starts fresh, with the first person's turn.
        s.oneOffTasks = s.oneOffTasks.filter((x) => x.id !== id);
        s.chores.push({ id: t.id, name, points: value, frequency: target, assignedTo: s.players[0].id, lastDoneBy: null, lastDoneAt: null });
      }
    } else if (type === "reward") {
      const r = s.rewards.find((x) => x.id === id);
      if (!r) return;
      r.name = name;
      r.cost = value;
    }
  });
}

function renamePlayer(id, name) {
  name = (name || "").trim();
  if (name) {
    update((s) => {
      const p = s.players.find((p) => p.id === id);
      if (p) { p.name = name; p.initial = name.charAt(0).toUpperCase(); }
    });
  }
  ui.editingPlayer = null;
  render();
}

// ---------- sync (Firebase Realtime Database — Google infra, CORS-friendly) ----------
// Both of you load this same page, both point at the same database URL baked
// in above, so there's nothing to log into or configure per-person.
async function dbGet() {
  const res = await fetch(`${FIREBASE_URL}/${DB_PATH}.json`);
  if (!res.ok) throw new Error(`Sync read failed (${res.status})`);
  return res.json(); // null if nothing stored yet
}
async function dbPut(data) {
  const res = await fetch(`${FIREBASE_URL}/${DB_PATH}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(`Sync write failed (${res.status})`);
}

async function pushRemote() {
  if (!SYNC_ENABLED) return;
  syncStatus = "syncing";
  renderSyncBadge();
  try {
    await dbPut(state);
    syncStatus = "synced";
    lastSyncedAt = new Date();
  } catch (e) {
    console.error(e);
    syncStatus = "error";
  }
  renderSyncBadge();
}

async function pullRemote() {
  if (!SYNC_ENABLED) return;
  syncStatus = "syncing";
  renderSyncBadge();
  try {
    const remote = await dbGet();
    if (remote && (!state.updatedAt || (remote.updatedAt && remote.updatedAt > state.updatedAt))) {
      state = normalize(remote);
      save();
      render();
    } else if (!remote) {
      // Nothing stored yet — seed the database with what we have.
      await dbPut(state);
    }
    syncStatus = "synced";
    lastSyncedAt = new Date();
  } catch (e) {
    console.error(e);
    syncStatus = "error";
  }
  renderSyncBadge();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(pullRemote, POLL_INTERVAL_MS);
}
function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) pullRemote();
});

function syncBadgeContent() {
  if (!SYNC_ENABLED) return { text: "💾 Saved on this device only", color: "var(--text-faint)" };
  if (syncStatus === "syncing") return { text: "🔄 Syncing…", color: "var(--text-faint)" };
  if (syncStatus === "error") return { text: "⚠️ Sync hiccup, retrying…", color: "var(--danger)" };
  const time = lastSyncedAt ? lastSyncedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  return { text: `🔗 Synced${time ? " · " + time : ""}`, color: "var(--sage)" };
}
function renderSyncBadge() {
  const el = document.getElementById("syncBadge");
  if (!el) return;
  const { text, color } = syncBadgeContent();
  el.textContent = text;
  el.style.color = color;
}

// ---------- edit card (shared by chores, one-off tasks and rewards) ----------
function editCardHtml(type, item) {
  const isChore = type === "chore";
  const isReward = type === "reward";
  const accent = type === "oneoff" ? "var(--berry)" : "var(--sage)";
  const noun = isChore ? "chore" : isReward ? "reward" : "one-off task";
  const currentKind = isChore ? item.frequency : "oneoff";
  const freqSelect = !isReward ? `
        <select id="editFreq_${item.id}" title="Move to…">
          ${TASK_KINDS.map((f) => `<option value="${f.id}" ${f.id === currentKind ? "selected" : ""}>${f.emoji} ${f.label}</option>`).join("")}
        </select>` : "";
  return `
    <div class="card fade-in" style="padding:14px;border:1px dashed ${accent}">
      <p style="margin:0 0 8px;font-size:12px;font-weight:800;color:${accent}">Edit ${noun}</p>
      <input id="editName_${item.id}" value="${esc(item.name)}" placeholder="Name" style="width:100%;margin-bottom:8px" />
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <label style="font-size:12px;font-weight:700;color:var(--text-faint)">${isReward ? "Cost" : "Points"}</label>
        <input id="editVal_${item.id}" type="number" min="1" value="${num(isReward ? item.cost : item.points, 1)}" style="width:64px" />
        ${freqSelect}
        <div style="flex:1"></div>
        <button class="btn" style="background:none;color:var(--text-faint)" title="Cancel" onclick="cancelEdit()">✕</button>
        <button class="btn pill" style="background:${accent};color:#fff" onclick="saveEdit('${type}','${item.id}')">✔ Save</button>
      </div>
    </div>`;
}

// ---------- render ----------
function render() {
  const app = document.getElementById("app");
  const headerNames = state.players.map((p) => {
    if (ui.editingPlayer === p.id) {
      return `
        <div class="row" style="gap:4px">
          <input id="editNameInput" class="fade-in" style="font-size:12px;border-radius:999px;padding:4px 10px;width:100px" value="${esc(p.name)}" data-player="${p.id}" />
          <button class="btn" style="color:var(--sage)" onclick="renamePlayer('${p.id}', document.getElementById('editNameInput').value)">✔</button>
        </div>`;
    }
    return `
      <button class="btn pill" style="background:${p.color}1A;color:${p.color}" onclick="ui.editingPlayer='${p.id}'; render(); document.getElementById('editNameInput')?.focus();">
        ${esc(p.name)} <span style="opacity:.5">✎</span>
      </button>`;
  }).join("");

  const badge = syncBadgeContent();
  const setupBanner = !SYNC_ENABLED ? `
    <div class="card" style="padding:12px 14px;margin-bottom:16px;background:var(--sun-soft);border-color:transparent">
      <p style="margin:0;font-size:12px;color:var(--text)">
        <b>Not synced yet.</b> To share this garden with your partner, grab a free bin ID at
        <a class="link" href="https://console.firebase.google.com" target="_blank" rel="noopener">Firebase</a> (free, just a Google account),
        then paste your database URL into the <code>FIREBASE_URL</code> constant near the top of this file and redeploy. Until then, everything's saved only on this device.
      </p>
    </div>` : "";

  const jars = state.players.map((p) => `
    <div class="card" style="padding:14px" >
      <div class="row" style="gap:10px">
        <div class="avatar" style="background:${p.color}">${esc(p.initial)}</div>
        <div style="min-width:0">
          <p style="margin:0;font-size:12px;font-weight:700;color:var(--text-muted)">${esc(p.name)}'s points</p>
          <p class="display" style="margin:2px 0 0;font-size:24px;font-weight:700;line-height:1;color:${p.color}">🪙 ${num(p.points, 0)}</p>
        </div>
      </div>
    </div>
  `).join("");

  const editBtn = (type, id) => `<button class="icon-edit btn" title="Edit" onclick="startEdit('${type}','${id}')">✎</button>`;
  const isEditing = (type, id) => !!ui.editing && ui.editing.type === type && ui.editing.id === id;

  const choreCardHtml = (chore) => {
    if (isEditing("chore", chore.id)) return editCardHtml("chore", chore);
    const assigned = playerById(chore.assignedTo);
    const lastPlayer = playerById(chore.lastDoneBy);
    const freq = FREQUENCIES.find((f) => f.id === chore.frequency) || FREQUENCIES[1];
    const doneMark = isDoneThisPeriod(chore)
      ? `<span style="color:var(--sage);font-size:11px;font-weight:800;margin-left:6px">✓ ${freq.doneLabel}</span>` : "";
    const lastLine = lastPlayer
      ? `Last: <span style="color:${lastPlayer.color};font-weight:700">${esc(lastPlayer.name)}</span> · ${formatRelative(chore.lastDoneAt)}`
      : "Never done yet";
    const avatarBtns = state.players.map((p) => `
      <button class="btn avatar" style="background:${p.color};width:32px;height:32px;font-size:12px" title="Mark done by ${esc(p.name)}" onclick="logChore('${chore.id}','${p.id}')">${esc(p.initial)}</button>
    `).join("");
    return `
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <p style="margin:0;font-weight:800;font-size:14px">${esc(chore.name)}${doneMark}</p>
          <p style="margin:2px 0 0;font-size:11px;color:var(--text-faint)">${lastLine}</p>
        </div>
        <div class="row" style="gap:4px">
          <span class="pill coin" style="background:var(--sun-soft);color:var(--sun)">${num(chore.points, 0)}</span>
          ${editBtn("chore", chore.id)}
          <button class="icon-trash btn" style="color:var(--text-faint)" title="Remove chore" onclick="deleteChore('${chore.id}')">🗑</button>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:10px">
        <button class="btn pill" style="background:${assigned?.color || '#ccc'}1A;color:${assigned?.color || '#888'}" title="Switch who's on this chore" onclick="swapAssignment('${chore.id}')">
          Turn: ${esc(assigned?.name || "—")} ⇄
        </button>
        <div class="row" style="gap:6px">${avatarBtns}</div>
      </div>
    </div>`;
  };

  const choreSectionHtml = (freq) => {
    const list = state.chores.filter((c) => c.frequency === freq.id);
    const doneCount = list.filter((c) => isDoneThisPeriod(c)).length;
    const adding = ui.addingChore === freq.id;
    const addCard = adding ? `
    <div class="card fade-in" style="padding:14px;border:1px dashed var(--sage)">
      <p style="margin:0 0 8px;font-size:12px;font-weight:800;color:var(--sage)">New ${freq.label.toLowerCase()} chore</p>
      <input id="newChoreName" placeholder="Chore name" style="width:100%;margin-bottom:8px" />
      <div class="row" style="gap:8px">
        <label style="font-size:12px;font-weight:700;color:var(--text-faint)">Points</label>
        <input id="newChorePoints" type="number" min="1" value="5" style="width:64px" />
        <div style="flex:1"></div>
        <button class="btn" style="background:none;color:var(--text-faint)" onclick="ui.addingChore=false; render();">✕</button>
        <button class="btn pill" style="background:var(--sage);color:#fff" onclick="addChore(document.getElementById('newChoreName').value, document.getElementById('newChorePoints').value, '${freq.id}'); render();">✔ Save</button>
      </div>
    </div>` : "";
    return `
    <section class="sect">
    <div class="sect-head">
      <div class="row" style="gap:6px">
        <span>${freq.emoji}</span>
        <h2 class="display" style="margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em">${freq.label}</h2>
        ${list.length ? `<span style="font-size:11px;font-weight:700;color:var(--text-faint)">${doneCount}/${list.length} done</span>` : ""}
      </div>
      <button class="btn pill" style="background:var(--sage-soft);color:var(--sage)" onclick="ui.addingChore='${freq.id}'; render();">+ Add</button>
    </div>
    ${list.length || adding ? `
    <div class="cardgrid">${list.map((c) => choreCardHtml(c)).join("")}${addCard}</div>` : `
    <p style="margin:0;font-size:12px;color:var(--text-faint)">No ${freq.label.toLowerCase()} chores yet — tap "+ Add".</p>`}
    </section>`;
  };

  const oneOffCards = state.oneOffTasks.map((task) => {
    if (isEditing("oneoff", task.id)) return editCardHtml("oneoff", task);
    const avatarBtns = state.players.map((p) => `
      <button class="btn avatar" style="background:${p.color};width:32px;height:32px;font-size:12px" title="Mark done by ${esc(p.name)}" onclick="completeOneOffTask('${task.id}','${p.id}')">${esc(p.initial)}</button>
    `).join("");
    return `
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <p style="margin:0;font-weight:800;font-size:14px">${esc(task.name)}</p>
        <div class="row" style="gap:4px">
          <span class="pill coin" style="background:var(--sun-soft);color:var(--sun)">${num(task.points, 0)}</span>
          ${editBtn("oneoff", task.id)}
          <button class="icon-trash btn" style="color:var(--text-faint)" title="Remove task" onclick="deleteOneOffTask('${task.id}')">🗑</button>
        </div>
      </div>
      <div class="row" style="justify-content:flex-end;gap:6px;margin-top:10px">${avatarBtns}</div>
    </div>`;
  }).join("");

  const addOneOffCard = ui.addingOneOff ? `
    <div class="card fade-in" style="padding:14px;border:1px dashed var(--berry)">
      <p style="margin:0 0 8px;font-size:12px;font-weight:800;color:var(--berry)">New one-off task</p>
      <input id="newOneOffName" placeholder="Task name" style="width:100%;margin-bottom:8px" />
      <div class="row" style="gap:8px">
        <label style="font-size:12px;font-weight:700;color:var(--text-faint)">Points</label>
        <input id="newOneOffPoints" type="number" min="1" value="10" style="width:64px" />
        <div style="flex:1"></div>
        <button class="btn" style="background:none;color:var(--text-faint)" onclick="ui.addingOneOff=false; render();">✕</button>
        <button class="btn pill" style="background:var(--berry);color:#fff" onclick="addOneOffTask(document.getElementById('newOneOffName').value, document.getElementById('newOneOffPoints').value); render();">✔ Save</button>
      </div>
    </div>` : "";

  const rewardCards = state.rewards.map((reward) => {
    if (isEditing("reward", reward.id)) return editCardHtml("reward", reward);
    const btns = state.players.map((p) => {
      const canAfford = num(p.points, 0) >= reward.cost;
      return `<button class="btn" style="flex:1;font-size:12px;font-weight:700;padding:6px 0;border-radius:8px;background:${canAfford ? p.color + "1A" : "var(--card-border-soft)"};color:${canAfford ? p.color : "var(--text-faint)"}" ${canAfford ? "" : "disabled"} onclick="redeemReward('${reward.id}','${p.id}')">💗 ${esc(p.name.split(" ")[0])}</button>`;
    }).join("");
    return `
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <p style="margin:0;font-weight:800;font-size:14px">${esc(reward.name)}</p>
        <div class="row" style="gap:4px">
          <span class="pill coin" style="background:var(--sun-soft);color:var(--sun)">${num(reward.cost, 0)}</span>
          ${editBtn("reward", reward.id)}
          <button class="icon-trash btn" style="color:var(--text-faint)" title="Remove reward" onclick="deleteReward('${reward.id}')">🗑</button>
        </div>
      </div>
      <div class="row" style="gap:8px;margin-top:10px">${btns}</div>
    </div>`;
  }).join("");

  const addRewardCard = ui.addingReward ? `
    <div class="card fade-in" style="padding:14px;border:1px dashed var(--sage)">
      <p style="margin:0 0 8px;font-size:12px;font-weight:800;color:var(--sage)">New reward</p>
      <input id="newRewardName" placeholder="Reward name" style="width:100%;margin-bottom:8px" />
      <div class="row" style="gap:8px">
        <label style="font-size:12px;font-weight:700;color:var(--text-faint)">Cost</label>
        <input id="newRewardCost" type="number" min="1" value="15" style="width:64px" />
        <div style="flex:1"></div>
        <button class="btn" style="background:none;color:var(--text-faint)" onclick="ui.addingReward=false; render();">✕</button>
        <button class="btn pill" style="background:var(--sage);color:#fff" onclick="addReward(document.getElementById('newRewardName').value, document.getElementById('newRewardCost').value); render();">✔ Save</button>
      </div>
    </div>` : "";

  const historyItems = state.history.map((h) => `
    <div class="row fade-in" style="justify-content:space-between;font-size:12px;color:var(--text-muted);padding:2px 0">
      <span><span style="color:${h.color}">●</span> ${esc(h.text)}</span>
      <span style="font-weight:700;color:${h.delta > 0 ? "var(--sage)" : "var(--danger)"}">${h.delta > 0 ? "+" : ""}${h.delta} pts</span>
    </div>`).join("");

  const gardenView = `
    ${setupBanner}

    <div class="pts-grid" style="margin-bottom:22px">${jars}</div>

    <div class="cols3">${FREQUENCIES.map((f) => choreSectionHtml(f)).join("")}</div>

    <div class="cols2">
      <section class="sect">
        <div class="sect-head">
          <div class="row" style="gap:6px"><span>🎯</span><h2 class="display" style="margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em">One-off Tasks</h2></div>
          <button class="btn pill" style="background:var(--berry-soft);color:var(--berry)" onclick="ui.addingOneOff=true; render();">+ Add</button>
        </div>
        ${state.oneOffTasks.length || ui.addingOneOff ? `
        <div class="cardgrid">${oneOffCards}${addOneOffCard}</div>` : `
        <p style="margin:0;font-size:12px;color:var(--text-faint)">Nothing special on the list right now — tap "+ Add" for a task that's a one-time thing, like fixing the shelf or returning a package.</p>`}
      </section>

      <section class="sect">
        <div class="sect-head">
          <div class="row" style="gap:6px"><span>🎁</span><h2 class="display" style="margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em">Rewards</h2></div>
          <button class="btn pill" style="background:var(--sage-soft);color:var(--sage)" onclick="ui.addingReward=true; render();">+ Add</button>
        </div>
        <div class="cardgrid">${rewardCards}${addRewardCard}</div>
      </section>
    </div>

    ${state.history.length ? `
    <div>
      <p style="margin:0 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint)">Recent activity</p>
      <div style="max-width:560px">${historyItems}</div>
    </div>` : ""}
  `;

  // Snapshot any open form fields so a background sync re-render doesn't wipe what's being typed.
  const prevValues = {};
  app.querySelectorAll("input[id], select[id]").forEach((el) => { prevValues[el.id] = el.value; });
  let activeId = null, selStart = null, selEnd = null;
  const ae = document.activeElement;
  if (ae && ae.id && Object.prototype.hasOwnProperty.call(prevValues, ae.id)) {
    activeId = ae.id;
    try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) {}
  }

  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:4px">
      <div class="row" style="gap:8px">
        <span style="font-size:22px">🌷</span>
        <h1 class="display" style="margin:0;font-size:22px;font-weight:700">Our Chore Garden</h1>
      </div>
      <div class="row" style="gap:6px">
        ${headerNames}
        <button class="btn theme-btn" title="Toggle dark mode" onclick="toggleTheme()">${getTheme() === "dark" ? "☀️" : "🌙"}</button>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-bottom:14px">
      <span id="syncBadge" class="sync-badge" style="color:${badge.color}">${badge.text}</span>
    </div>

    ${gardenView}
  `;

  Object.keys(prevValues).forEach((id) => {
    const el = document.getElementById(id);
    if (el && "value" in el) el.value = prevValues[id];
  });
  let focusId = activeId, selectAll = false;
  if (ui.focusId) { focusId = ui.focusId; selectAll = true; ui.focusId = null; }
  const focusEl = focusId ? document.getElementById(focusId) : null;
  if (focusEl) {
    focusEl.focus();
    try {
      if (selectAll && focusEl.select) focusEl.select();
      else if (selStart !== null && focusEl.setSelectionRange) focusEl.setSelectionRange(selStart, selEnd);
    } catch (e) {}
  }

  if (ui.editing) {
    const etype = ui.editing.type, eid = ui.editing.id;
    ["editName_", "editVal_", "editFreq_"].forEach((prefix) => {
      const el = document.getElementById(prefix + eid);
      if (el) el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveEdit(etype, eid);
        else if (e.key === "Escape") cancelEdit();
      });
    });
  }

  // wire up enter-to-save on the add-chore / add-reward / rename inputs
  const nc = document.getElementById("newChoreName");
  if (nc) nc.addEventListener("keydown", (e) => { if (e.key === "Enter") { addChore(nc.value, document.getElementById("newChorePoints").value, ui.addingChore); render(); } });
  const nr = document.getElementById("newRewardName");
  if (nr) nr.addEventListener("keydown", (e) => { if (e.key === "Enter") { addReward(nr.value, document.getElementById("newRewardCost").value); render(); } });
  const no = document.getElementById("newOneOffName");
  if (no) no.addEventListener("keydown", (e) => { if (e.key === "Enter") { addOneOffTask(no.value, document.getElementById("newOneOffPoints").value); render(); } });
  const en = document.getElementById("editNameInput");
  if (en) { en.focus(); en.addEventListener("keydown", (e) => { if (e.key === "Enter") renamePlayer(en.dataset.player, en.value); }); }
}

// ---------- init ----------
render();
if (SYNC_ENABLED) {
  pullRemote().then(startPolling);
}
</script>
</body>
</html>
